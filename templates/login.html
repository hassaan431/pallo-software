<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — AK Distributors</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link rel="shortcut icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-page">
  <div class="login-card">
    <div style="display:flex; justify-content:center; align-items:center; gap:16px; margin-bottom:20px;">
      <img
        src="{{ url_for('static', filename='logos/AK Distributors Logo.jpeg') }}"
        alt="AK Distributors Logo"
        style="max-height:70px; width:auto; display:block;"
      >
      <img
        src="{{ url_for('static', filename='logos/Zain Foods Logo.jpeg') }}"
        alt="Zain Foods Logo"
        style="max-height:70px; width:auto; display:block;"
      >
    </div>
    <h1>AK Distributors LLC</h1>
    <p class="login-sub">Sign in to continue</p>
    {% if error %}
    <div class="alert-error" role="alert">{{ error }}</div>
    {% endif %}
    <form method="post" action="{{ url_for('login') }}" novalidate>
      <div class="form-group">
        <label for="username">Username</label>
        <input class="form-control" type="text" id="username" name="username" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input class="form-control" type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Login</button>
    </form>
  </div>
</body>
</html>
